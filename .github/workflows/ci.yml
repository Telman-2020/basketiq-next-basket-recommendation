name: BasketIQ CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Validate project structure
        run: |
          test -f README.md
          test -f requirements.txt
          test -f Dockerfile
          test -f docker-compose.yml
          test -f app/streamlit_app.py
          test -f src/basketiq/config.py
          test -f src/basketiq/features.py
          test -f src/basketiq/train_bayesian_optimization.py
          test -f src/basketiq/llm_customer_analysis.py

      - name: Check Python imports
        run: |
          python -c "import pandas, numpy, sklearn, xgboost, lightgbm, catboost, optuna, streamlit, joblib"

      - name: Check BasketIQ package imports
        run: |
          python -c "from src.basketiq.config import PROJECT_ROOT, RAW_DATA_DIR, PROCESSED_DATA_DIR; print(PROJECT_ROOT)"
          python -c "from src.basketiq.models import get_models; print(get_models().keys())"

      - name: Run syntax checks
        run: |
          python -m compileall src app

      - name: Build Docker image
        run: |
          docker build -t basketiq-next-basket-recommendation .